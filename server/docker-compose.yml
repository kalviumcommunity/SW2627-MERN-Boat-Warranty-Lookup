services:
  postgres:
    image: postgres:17
    container_name: boat-warranty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boat_warranty
    ports:
      - "5433:5432"
    volumes:
      - boat_warranty_postgres_data:/var/lib/postgresql/data

volumes:
  boat_warranty_postgres_data: